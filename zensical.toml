[project]
site_url = "https://www.example.com/"
site_name = "Web Development Cheatsheet"
site_description = "Cheatsheet for refreshing my web development knowledge"
site_author = "Farid NL"

copyright = "Copyright &copy; 2026 Farid NL"

# repo_url = "https://github.com/user/repo"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

nav = [
  { "HTML" = [
    { "Introducción" = "html/01-introduction.md" },
    { "Texto" = "html/02-text.md" },
    { "Hipervínculos" = "html/03-hyperlinks.md" },
    { "Imagenes" = "html/04-images.md" },
    { "Formularios" = "html/05-forms.md" },
    { "Contenedores" = "html/06-containers.md" },
    { "Tablas" = "html/07-tables.md" },
  ] },
  { "CSS" = [
    { "Introducción" = "css/01-introduction.md" },
    { "Texto" = [
      { "Estilo" = "css/02-text/01-style.md" },
      { "Tamaño y espaciado" = "css/02-text/02-size.md" },
      { "Color y familia" = "css/02-text/03-color.md" },
    ] },
    { "Selectores" = [
      { "Basicos" = "css/03-selectors/01-basics.md" },
      { "Pseudo y Especificidad" = "css/03-selectors/02-pseudo.md" },
      { "Universal y Herencia" = "css/03-selectors/03-universal.md" },
    ] },
  ] },
]

# extra_css = ["assets/css/extra.css"]
# extra_javascript = ["assets/js/extras.mjs"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins]
glightbox = {}
